<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Popup</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- sandbox ohne allow-same-origin: Inhalte im iframe kommen nicht an die
       Popup-Seite und damit nicht an die Python-Funktionen heran. -->
  <iframe id="view-frame" title="Anzeige" sandbox="allow-scripts"></iframe>

  <!-- Ziehen ändert die Aufteilung zwischen Ansicht und Chat, Doppelklick setzt sie zurück -->
  <div id="splitter" title="Ziehen: Größe von Ansicht und Chat ändern · Doppelklick: zurücksetzen"></div>

  <!-- nicht id="chat": das würde die globale Python-Funktion chat() verdecken -->
  <section id="chat-panel">
    <div id="chat-toolbar">
      <button type="button" id="chat-max-button" title="Ansicht ausblenden, Chat über die ganze Höhe">⇕ Chat groß</button>
      <button type="button" id="enlarge-button" title="Fenster vergrößern">⤢ Fenster groß</button>
    </div>
    <div id="chat-scroll">
      <div id="chat-history"></div>
      <!-- erscheint, wenn man hochgescrollt hat -->
      <button type="button" id="scroll-down-button" title="Zur neuesten Nachricht" hidden>↓</button>
    </div>
    <form id="input-form">
      <!-- Sprachmodell (Ollama); bleibt versteckt, wenn der Assistent keins nutzt -->
      <select id="model-select" title="Sprachmodell" hidden></select>
      <input id="message-input" placeholder="Nachricht an den Assistenten…" autocomplete="off">
      <!-- Spracheingabe: Klick startet, zweiter Klick sendet, Escape bricht ab; versteckt ohne Mikrofon-Pakete -->
      <button type="button" id="record-button" title="Spracheingabe starten" hidden>🎤</button>
      <button type="submit">Senden</button>
    </form>
  </section>

  <!-- Markdown und Formeln in Antworten (markdown.js), Bibliotheken lokal in vendor/ -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="markdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
