<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVE</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="fonts/press-start-2p/font.css">
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="design-styles.css">
</head>
<body>
  <header id="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><img src="icons/agent.svg" alt=""></span>
      <div><strong>EVE</strong><span class="brand-caption">Enhanced Virtual Entity</span></div>
    </div>
    <nav class="header-actions" aria-label="Darstellung und Einstellungen">
      <button type="button" id="design-button" class="quiet-button" aria-haspopup="dialog" aria-controls="design-panel" aria-expanded="false" title="Design auswählen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg><span>Design</span></button>
      <button type="button" id="settings-button" class="icon-button" title="Einstellungen" aria-label="Einstellungen öffnen"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 4 2 2v4l4 3 3-1 3 1 4-3v-4l2-2-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </nav>
  </header>
  <section id="design-panel" role="dialog" aria-labelledby="design-title" hidden>
    <div class="design-heading"><div><span class="eyebrow">DEIN STIL</span><h2 id="design-title">Mach es zu deinem.</h2></div><button type="button" id="design-close" class="icon-button" aria-label="Designauswahl schließen">×</button></div>
    <p class="design-description">Ein neuer Look. Derselbe Assistent.</p>
    <div id="design-options" role="radiogroup" aria-label="Design auswählen"></div>
    <p id="design-status" class="design-note" role="status" aria-live="polite">Deine Auswahl wird automatisch gespeichert.</p>
  </section>
  <!-- Die isolierte Ansicht erhält nur freigegebene Designwerte per postMessage. -->
  <iframe id="view-frame" title="Dein Überblick" sandbox="allow-scripts"></iframe>
  <div id="splitter" role="separator" aria-label="Aufteilung zwischen Überblick und Chat" aria-orientation="horizontal" tabindex="0" title="Ziehen: Aufteilung ändern · Doppelklick: zurücksetzen"></div>
  <section id="chat-panel" aria-label="Unterhaltung">
    <div id="chat-toolbar"><span class="section-label">UNTERHALTUNG</span><span class="toolbar-gap"></span>
      <button type="button" id="chat-max-button" class="icon-button" title="Chat vergrößern" aria-label="Überblick ausblenden" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 9h16"/></svg></button>
      <button type="button" id="enlarge-button" class="icon-button" title="Fenster vergrößern" aria-label="Fenster vergrößern" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </div>
    <div id="chat-scroll"><div id="chat-history" role="log" aria-label="Nachrichten" aria-live="polite" aria-relevant="additions"></div><button type="button" id="scroll-down-button" aria-label="Zur neuesten Nachricht" title="Zur neuesten Nachricht" hidden>↓</button></div>
    <div id="suggestion-chips" aria-label="Schnellbefehle"><button type="button" data-command="uhrzeit">Wie spät ist es?<span aria-hidden="true">↗</span></button><button type="button" data-command="hilfe">Was kannst du?<span aria-hidden="true">↗</span></button></div>
    <form id="input-form">
      <div class="composer-input"><input id="message-input" aria-label="Nachricht" placeholder="Was möchtest du wissen?" autocomplete="off"><button type="button" id="record-button" class="icon-button" title="Spracheingabe starten" aria-label="Spracheingabe starten" hidden>🎤</button><button type="submit" id="send-button" aria-label="Nachricht senden" title="Senden"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg></button></div>
      <div class="composer-footer"><span class="composer-hint">Ein Gedanke genügt.</span><select id="model-select" title="Sprachmodell auswählen" aria-label="Sprachmodell auswählen" hidden></select></div>
    </form>
  </section>
  <section id="settings-panel" role="dialog" aria-labelledby="settings-title" hidden>
    <header id="settings-header"><div><span class="eyebrow">PERSÖNLICH EINSTELLEN</span><h2 id="settings-title">Ganz nach deinem Wunsch.</h2></div><button type="button" id="settings-close" class="icon-button" title="Schließen ohne Speichern" aria-label="Einstellungen schließen">×</button></header>
    <nav id="settings-tabs" aria-label="Einstellungsbereiche"><button type="button" data-tab="answer">Antworten</button><button type="button" data-tab="tools">Werkzeuge</button></nav>
    <div id="settings-body"></div>
    <footer id="settings-footer"><span id="settings-status" role="status"></span><button type="button" id="settings-reset">Standard wiederherstellen</button><div class="settings-save-actions"><button type="button" id="settings-cancel">Abbrechen</button><button type="button" id="settings-save" class="primary">Speichern</button></div></footer>
  </section>
  <script src="vendor/marked.min.js"></script><script src="vendor/purify.min.js"></script><script src="vendor/katex/katex.min.js"></script>
  <script src="markdown.js"></script><script src="popup.js"></script><script src="settings.js"></script>
</body>
</html>
